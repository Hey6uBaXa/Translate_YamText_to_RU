zabbix_export:
  graphs:
  - graph_items:
    - color: 199C0D
      item:
        host: Linux by Zabbix agent
        key: system.cpu.switches
    - color: F63100
      item:
        host: Linux by Zabbix agent
        key: system.cpu.intr
      sortorder: '1'
    name: 'Linux: скачки ЦП'
    uuid: 4a72646168d545c398c92e09c975a966
  template_groups:
  - description: Сгенерировано официальным шаблонизатором Zabbix "Templator"
    name: Шаблоны/Операционные системы
    uuid: 846977d1dfed4968bc5f8bdb363285bc
  templates:
  - description: тест
    groups:
    - name: Шаблоны/Операционные системы
    items:
    - delay: 1h
      key: agent.hostname
      name: Имя хоста запущенного агента Zabbix
      preprocessing:
      - parameters:
        - 1d
        type: DISCARD_UNCHANGED_HEARTBEAT
      tags:
      - tag: component
        value: system
      trends: '0'
      uuid: df561a0cece94760a78704edf7da7326
      value_type: CHAR
    - description: Агент всегда возвращает "1" для этого элемента. Может использоваться
        в сочетании с `nodata()` для проверки доступности.
      key: agent.ping
      name: Пинг агента Zabbix
      tags:
      - tag: component
        value: system
      uuid: f94f9f4699e94c369e6c98b2a2f485ce
      valuemap:
        name: Статус пинга агента Zabbix
    name: Linux через агент Zabbix
    template: Linux by Zabbix agent
    uuid: f8f7908280354f2abeed07dc788c3747
    vendor:
      name: Заббикс
      version: 7.0-0
  triggers:
  - event_name: Приближаемся к пределу процесса (использовано более 80%)
    expression: последний(/Linux по Zabbix агенту/proc.num)/последний(/Linux по Zabbix
      агенту/kernel.maxproc)*100>80
    name: Приближаемся к пределу процесса
    opdata: '{ITEM.LASTVALUE1} active, {ITEM.LASTVALUE2} limit.'
    priority: WARNING
    tags:
    - tag: scope
      value: performance
    uuid: ae5269e17d434927bfd6edc09a9a1f4d
  - dependencies:
    - expression: мин(/Linux by Zabbix agent/vm.memory.utilization,5m)>{$MEMORY.UTIL.MAX}
      name: Высокое использование памяти
    - expression: max(/Linux by Zabbix agent/vm.memory.size[available],5m)<{$MEMORY.AVAILABLE.MIN}
        и last(/Linux by Zabbix agent/vm.memory.size[total])>0
      name: Недостаток доступной памяти
    description: Если подкачка не настроена, этот триггер игнорируется.
    event_name: Высокое использование пространства подкачки (свободно менее {$SWAP.PFREE.MIN.WARN}%)
    expression: max(/Linux by Zabbix agent/system.swap.size[,pfree],5m)<{$SWAP.PFREE.MIN.WARN}
      и last(/Linux by Zabbix agent/system.swap.size[,total])>0
    name: Высокое использование пространства подкачки
    opdata: 'Free: {ITEM.LASTVALUE1}, total: {ITEM.LASTVALUE2}'
    priority: WARNING
    tags:
    - tag: scope
      value: capacity
    uuid: f49fc01c5ac945d59455563bdbcc6469
  version: '7.0'
